<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zubair | Official</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a12;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* پس‌زمینه با افکت دایره‌ای */
        .bg-circle {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            animation: bgFloat 10s ease-in-out infinite alternate;
        }

        .bg1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #6a1a8a, transparent);
            top: -200px;
            right: -200px;
            opacity: 0.3;
        }

        .bg2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #1a3a8a, transparent);
            bottom: -150px;
            left: -150px;
            opacity: 0.25;
            animation-delay: 5s;
        }

        .bg3 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #8a1a3a, transparent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.15;
            animation-delay: 3s;
        }

        @keyframes bgFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -30px) scale(1.2); }
        }

        /* افکت گرید */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 15s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: perspective(600px) rotateX(0deg) translateY(0); }
            100% { transform: perspective(600px) rotateX(2deg) translateY(50px); }
        }

        /* کارت اصلی */
        .card-main {
            background: rgba(10, 10, 18, 0.85);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(200, 100, 255, 0.12);
            border-radius: 40px;
            padding: 45px 35px 35px;
            width: 420px;
            max-width: 92%;
            text-align: center;
            box-shadow: 
                0 0 80px rgba(200, 100, 255, 0.05),
                inset 0 0 80px rgba(200, 100, 255, 0.02);
            z-index: 10;
            position: relative;
            animation: cardFloat 6s ease-in-out infinite;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* خطوط نئونی دور کارت */
        .card-main::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #c8a0ff, #ff80b0, transparent);
            animation: neonLine 3s ease-in-out infinite;
        }

        @keyframes neonLine {
            0%, 100% { width: 40%; opacity: 0.3; }
            50% { width: 80%; opacity: 1; }
        }

        /* ایموجی با انیمیشن خاص */
        .main-emoji {
            font-size: 80px;
            display: block;
            margin-bottom: 5px;
            animation: emojiPulse 2s ease-in-out infinite;
            filter: drop-shadow(0 0 40px rgba(200, 100, 255, 0.2));
        }

        @keyframes emojiPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(-5deg); }
        }

        h1 {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #c8a0ff, #ff80b0, #c8a0ff);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientText 4s ease-in-out infinite;
            letter-spacing: 8px;
        }

        @keyframes gradientText {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .sub-title {
            color: rgba(200, 180, 220, 0.4);
            font-size: 0.6rem;
            letter-spacing: 6px;
            font-weight: 400;
            border-bottom: 1px solid rgba(200, 100, 255, 0.05);
            padding-bottom: 20px;
            margin-bottom: 20px;
            margin-top: 5px;
        }

        /* لینک‌ها با استایل جدید */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 13px 20px;
            background: rgba(200, 100, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(200, 100, 255, 0.06);
            color: #b8a8d0;
            text-decoration: none;
            font-size: 0.75rem;
            letter-spacing: 3px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            font-weight: 400;
        }

        .link-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(200, 100, 255, 0.06), transparent);
            transition: left 0.6s;
        }

        .link-item:hover {
            transform: translateX(10px) scale(1.03);
            border-color: rgba(200, 100, 255, 0.25);
            background: rgba(200, 100, 255, 0.06);
            box-shadow: 0 0 40px rgba(200, 100, 255, 0.05);
            color: #f0e8ff;
        }

        .link-item:hover::after {
            left: 100%;
        }

        .link-item .icon-link {
            font-size: 1.3rem;
            width: 30px;
            text-align: center;
            opacity: 0.6;
            transition: 0.3s;
        }

        .link-item:hover .icon-link {
            opacity: 1;
            transform: scale(1.2) rotate(-5deg);
        }

        .link-item .link-label {
            flex: 1;
            text-align: left;
        }

        .link-item .arrow {
            opacity: 0.2;
            transition: 0.3s;
        }

        .link-item:hover .arrow {
            opacity: 0.8;
            transform: translateX(5px);
        }

        /* پلیر آهنگ */
        .music-player {
            margin-top: 20px;
            padding: 12px;
            background: rgba(200, 100, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(200, 100, 255, 0.06);
        }

        .music-player audio {
            width: 100%;
            height: 30px;
            outline: none;
            background: transparent;
            border-radius: 10px;
        }

        .music-player audio::-webkit-media-controls-panel {
            background: rgba(200, 100, 255, 0.05);
            border-radius: 10px;
        }

        .music-label {
            color: rgba(200, 180, 220, 0.2);
            font-size: 0.5rem;
            letter-spacing: 4px;
            margin-bottom: 6px;
            display: block;
        }

        /* فوتر */
        .footer-sad {
            margin-top: 18px;
            color: rgba(200, 180, 220, 0.1);
            font-size: 0.5rem;
            letter-spacing: 5px;
            animation: blink 3s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 0.3; }
        }

        /* ذرات پس‌زمینه */
        .particle-dot {
            position: fixed;
            width: 2px;
            height: 2px;
            background: rgba(200, 100, 255, 0.08);
            border-radius: 50%;
            pointer-events: none;
            animation: particleMove linear infinite;
        }

        @keyframes particleMove {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.2; }
            90% { opacity: 0.2; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* کاور عکس (جایگزین استیکر) */
        .profile-cover {
            width: 100%;
            height: 120px;
            border-radius: 20px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, rgba(200, 100, 255, 0.1), rgba(255, 100, 150, 0.05));
            border: 1px solid rgba(200, 100, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: rgba(200, 180, 220, 0.1);
            letter-spacing: 10px;
            overflow: hidden;
            position: relative;
        }

        .profile-cover span {
            animation: coverPulse 4s ease-in-out infinite;
        }

        @keyframes coverPulse {
            0%, 100% { opacity: 0.1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <!-- پس‌زمینه‌ها -->
    <div class="bg-circle bg1"></div>
    <div class="bg-circle bg2"></div>
    <div class="bg-circle bg3"></div>
    <div class="grid-overlay"></div>

    <!-- کارت اصلی -->
    <div class="card-main">

        <!-- کاور عکس (جای استیکر) -->
        <div class="profile-cover">
            <span>✦ ZUBAIR ✦</span>
        </div>

        <span class="main-emoji">😔</span>
        <h1>ZUBAIR</h1>
        <div class="sub-title">✦ LOST IN THE VOID ✦</div>

        <!-- لینک‌ها با آدرس‌های خودت -->
        <div class="links-container">
            <a href="https://www.instagram.com/_._zubair_jailani_._707?igsh=MXJtYmJ6azk3Mm5qeA%3D%3D&utm_source=qr" target="_blank" class="link-item">
                <span class="icon-link">📸</span>
                <span class="link-label">INSTAGRAM</span>
                <span class="arrow">→</span>

            <a href="https://snapchat.com/t/eNzzSTGq" target="_blank" class="link-item">

                <span class="link-label">SNAPCHAT</span>

            </a>
            <a href="https://t.me/traikz" target="_blank" class="link-item">

                <span class="link-label">TELEGRAM</span>

            </a>
            <a href="https://www.tiktok.com/@z__ubair7" target="_blank" class="link-item">

    </div>

    <!-- ذرات -->
    <script>
        for (let i = 0; i < 40; i++) {
            const dot = document.createElement('div');
            dot.className = 'particle-dot';
            dot.style.left = Math.random() * 100 + 'vw';
            dot.style.animationDuration = (12 + Math.random() * 25) + 's';
            dot.style.animationDelay = (Math.random() * 15) + 's';
            dot.style.width = dot.style.height = (1 + Math.random() * 3) + 'px';
            document.body.appendChild(dot);
        }
    </script>

</body>
</html>
