<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zubair | Sad Neon</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0b12;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(0deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(2deg) translateY(60px); }
        }

        .neon-ring {
            position: fixed;
            border-radius: 50%;
            border: 1px solid rgba(200, 100, 255, 0.1);
            box-shadow: 0 0 80px rgba(200, 100, 255, 0.05);
            animation: ringRotate 20s linear infinite;
            pointer-events: none;
        }

        .ring-neon1 {
            width: 600px;
            height: 600px;
            top: -200px;
            right: -200px;
            animation-duration: 25s;
        }

        .ring-neon2 {
            width: 400px;
            height: 400px;
            bottom: -100px;
            left: -100px;
            animation-duration: 15s;
            animation-direction: reverse;
            border-color: rgba(255, 100, 150, 0.08);
        }

        @keyframes ringRotate {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .card-neon {
            background: rgba(11, 11, 18, 0.85);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(200, 100, 255, 0.15);
            border-radius: 30px;
            padding: 50px 40px 40px;
            width: 400px;
            max-width: 92%;
            text-align: center;
            box-shadow: 
                0 0 60px rgba(200, 100, 255, 0.05),
                inset 0 0 60px rgba(200, 100, 255, 0.02);
            z-index: 10;
            position: relative;
            transition: all 0.5s;
        }

        .card-neon:hover {
            border-color: rgba(200, 100, 255, 0.3);
            box-shadow: 0 0 100px rgba(200, 100, 255, 0.1);
        }

        .card-neon::before,
        .card-neon::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(200, 100, 255, 0.3), transparent);
        }

        .card-neon::before {
            top: -1px;
            animation: neonLine 3s ease-in-out infinite;
        }

        .card-neon::after {
            bottom: -1px;
            animation: neonLine 3s ease-in-out infinite reverse;
        }

        @keyframes neonLine {
            0%, 100% { opacity: 0.2; width: 40%; }
            50% { opacity: 1; width: 80%; }
        }

        .glitch-emoji {
            font-size: 90px;
            display: block;
            margin-bottom: 10px;
            animation: glitch 3s infinite;
            filter: drop-shadow(0 0 40px rgba(200, 100, 255, 0.2));
        }

        @keyframes glitch {
            0%, 90%, 100% { transform: translate(0); }
            92% { transform: translate(-3px, 2px) skewX(-2deg); }
            94% { transform: translate(3px, -2px) skewX(2deg); }
            96% { transform: translate(-2px, 1px); }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #c8a0ff, #ff80b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 10px;
            text-shadow: 0 0 40px rgba(200, 100, 255, 0.1);
            margin-bottom: 8px;
        }

        .sad-quote {
            color: rgba(200, 180, 220, 0.5);
            font-size: 0.7rem;
            letter-spacing: 6px;
            font-weight: 400;
            border-bottom: 1px solid rgba(200, 100, 255, 0.05);
            padding-bottom: 25px;
            margin-bottom: 25px;
        }

        .links-neon {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-neon {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 14px 20px;
            background: rgba(200, 100, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(200, 100, 255, 0.06);
            color: #b8a8d0;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 3px;
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
            font-weight: 400;
        }

        .link-neon::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(200, 100, 255, 0.05), transparent);
            transition: left 0.6s;
        }

        .link-neon:hover {
            transform: translateX(8px) scale(1.02);
            border-color: rgba(200, 100, 255, 0.2);
            background: rgba(200, 100, 255, 0.05);
            box-shadow: 0 0 30px rgba(200, 100, 255, 0.05);
            color: #e8d8ff;
        }

        .link-neon:hover::before {
            left: 100%;
        }

        .link-neon .icon-neon {
            font-size: 1.3rem;
            width: 30px;
            text-align: center;
            opacity: 0.6;
            transition: 0.3s;
        }

        .link-neon:hover .icon-neon {
            opacity: 1;
            transform: scale(1.2) rotate(-5deg);
        }

        .counter {
            margin-top: 25px;
            color: rgba(200, 180, 220, 0.15);
            font-size: 0.6rem;
            letter-spacing: 4px;
            font-weight: 400;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.15; }
            50% { opacity: 0.4; }
        }

        .particle {
            position: fixed;
            width: 2px;
            height: 2px;
            background: rgba(200, 100, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>
    <div class="neon-ring ring-neon1"></div>
    <div class="neon-ring ring-neon2"></div>

    <div class="card-neon">
        <span class="glitch-emoji">😔</span>
        <h1>ZUBAIR</h1>
        <div class="sad-quote">✦ LOST IN THE VOID ✦</div>

        <div class="links-neon">
            <!-- لینک‌های خودت رو اینجا عوض کن -->
            <a href="https://instagram.com" target="_blank" class="link-neon">
                <span class="icon-neon">📸</span> INSTAGRAM
            </a>
            <a href="https://tiktok.com" target="_blank" class="link-neon">
                <span class="icon-neon">🎵</span> TIKTOK
            </a>
            <a href="https://capcut.com" target="_blank" class="link-neon">
                <span class="icon-neon">🎬</span> CAPCUT
            </a>
            <a href="https://telegram.org" target="_blank" class="link-neon">
                <span class="icon-neon">✈️</span> TELEGRAM
            </a>
        </div>

        <div class="counter">✦ 404 SADNESS NOT FOUND ✦</div>
    </div>

    <script>
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (15 + Math.random() * 30) + 's';
            p.style.animationDelay = (Math.random() * 20) + 's';
            p.style.width = p.style.height = (1 + Math.random() * 3) + 'px';
            document.body.appendChild(p);
        }
    </script>

</body>
</html>
